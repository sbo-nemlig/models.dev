# Sources (docs.x.ai):
# - Model page: https://docs.x.ai/developers/models/grok-4.20-0309-non-reasoning
# - Models/pricing: https://docs.x.ai/developers/models, https://docs.x.ai/developers/pricing
# - Reasoning: https://docs.x.ai/developers/model-capabilities/text/reasoning
# - Caching (automatic prefix cache, prompt_cache_key): https://docs.x.ai/developers/advanced-api-usage/prompt-caching
# - Priority (service_tier = priority, 2x): https://docs.x.ai/developers/advanced-api-usage/priority-processing
# - API params (store, stream_options.include_usage, top_k): https://docs.x.ai/developers/rest-api-reference/inference/responses, https://docs.x.ai/developers/rest-api-reference/inference/chat-completions
schema = 2
name = "Grok 4.20 (Non-Reasoning)"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2026-03-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = true
store = true
stream_usage = true
prompt_cache_key = true
cache = { supported = true, implicit = true, explicit = false }
service_tier = ["priority"]

[limit]
context = 1_000_000
output = 30_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2
